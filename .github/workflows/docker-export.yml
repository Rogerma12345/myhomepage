name: Export Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - feat/zerotier-widget

jobs:
  export-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build vars
        id: vars
        run: |
          echo "buildtime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          NEXT_PUBLIC_BUILDTIME: ${{ steps.vars.outputs.buildtime }}
          NEXT_PUBLIC_VERSION: ${{ steps.vars.outputs.version }}
          NEXT_PUBLIC_REVISION: ${{ steps.vars.outputs.revision }}
        run: pnpm run build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export Docker image tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: myhomepage:${{ matrix.arch }}
          provenance: false
          build-args: |
            CI=true
            BUILDTIME=${{ steps.vars.outputs.buildtime }}
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ steps.vars.outputs.revision }}
          outputs: type=docker,dest=${{ runner.temp }}/myhomepage-${{ matrix.arch }}.tar

      - name: Compress image
        run: gzip -9 ${{ runner.temp }}/myhomepage-${{ matrix.arch }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myhomepage-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/myhomepage-${{ matrix.arch }}.tar.gz
          retention-days: 7
